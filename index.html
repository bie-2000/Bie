<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://github.com/bie-2000/Bie/blob/main/sketch1697147708944.ico" type="image/x-icon">
  <title>Go fuck yourself</title>
  <link rel="icon" href="https://raw.githubusercontent.com/bie-2000/Bie/main/612a350e7c7c75000443b283.png" type="image/png">
  <script>
    window.onload = function () {
      const dialog = document.getElementById('customDialog');
      const yesButton = document.getElementById('yesButton');
      const noButton = document.getElementById('noButton');
      const textAfterNo = document.getElementById('textAfterNo');
      const yesNoButtons = document.getElementById('yesNoButtons');
      const videoContainer = document.getElementById('videoContainer');
      const noButtonMove = document.getElementById('noButtonMove');
      
      dialog.style.display = 'block'; // Afișează dialogul personalizat
      
      yesButton.onclick = function () {
        document.getElementById('imageYes').style.display = 'block';
        document.getElementById('imageNo').style.display = 'none';
        dialog.style.display = 'none'; // Ascunde dialogul după selecție
      };
      
      noButton.onclick = function () {
        document.getElementById('imageYes').style.display = 'none';
        document.getElementById('imageNo').style.display = 'block';
        dialog.style.display = 'none'; // Ascunde dialogul după selecție
        
        // Afișează textul și butoanele suplimentare
        textAfterNo.style.display = 'block';
        yesNoButtons.style.display = 'block';
      };
      
      document.getElementById('yesAfterNo').onclick = function () {
        videoContainer.style.display = 'block'; // Afișează video-ul
        textAfterNo.style.display = 'none'; // Ascunde textul "Aaaa, m-ai gandeste-te putin!"
        yesNoButtons.style.display = 'none'; // Ascunde butoanele "Yes" și "No"
      };

      document.getElementById('noAfterNo').onclick = function () {
        // Muta butonul "No" pentru a nu mai fi selectabil
        noButtonMove.style.animation = 'moveButton 3s linear infinite';
        noButtonMove.disabled = true;
      };
    };
  </script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse, #fff, #000);
      font-family: Arial, sans-serif;
    }
    #customDialog {
      display: none; /* Ascunde dialogul inițial */
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      text-align: center;
      border-radius: 8px;
      z-index: 1000;
    }
    #customDialog p {
      font-size: 24px; /* Dimensiune mai mare */
      font-weight: bold; /* Text îngroșat */
      margin-bottom: 20px;
    }
    #customDialog button {
      font-size: 18px;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #customDialog #yesButton {
      background-color: #4CAF50;
      color: white;
    }
    #customDialog #noButton {
      background-color: #f44336;
      color: white;
    }
    img {
      display: none; /* Imaginile sunt ascunse inițial */
      margin-top: 20px;
    }
    #imageNo {
      width: 500px;
      height: auto;
    }
    #imageYes {
      width: 400px;
      height: auto;
    }
    #textAfterNo {
      display: none;
      font-size: 24px;
      font-weight: bold;
      color: red;
      margin-top: 20px;
    }
    #yesNoButtons {
      display: none;
      margin-top: 20px;
    }
    #yesNoButtons button {
      font-size: 18px;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #yesAfterNo {
      background-color: #4CAF50;
      color: white;
    }
    #noAfterNo {
      background-color: #f44336;
      color: white;
    }
    #videoContainer {
      display: none;
      margin-top: 20px;
    }

    /* Animația pentru mișcarea butonului "No" */
    @keyframes moveButton {
      0% {
        transform: translate(0, 0);
      }
      25% {
        transform: translate(200px, -200px);
      }
      50% {
        transform: translate(-300px, 300px);
      }
      75% {
        transform: translate(400px, -150px);
      }
      100% {
        transform: translate(-500px, 200px);
      }
    }

    #noButtonMove {
      transition: transform 1s;
    }
  </style>
</head>
<body>
  <div id="customDialog">
    <p>Do you wanna see my boobs?</p>
    <button id="yesButton">Yes</button>
    <button id="noButton" id="noButtonMove">No</button>
  </div>

  <!-- Imaginea care va apărea dacă utilizatorul selectează Yes -->
  <img id="imageYes" src="https://raw.githubusercontent.com/bie-2000/Bie/main/download.JPG" alt="Image for Yes" style="border-radius: 20px; mask-image: radial-gradient(circle, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%); -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);">

  <!-- Imaginea care va apărea dacă utilizatorul selectează No -->
  <img id="imageNo" src="https://raw.githubusercontent.com/bie-2000/Bie/main/wpid_vadim_tudor_ochelari6_09243300.jpg" alt="Image for No" style="border-radius: 20px; mask-image: radial-gradient(circle, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%); -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);">
  
  <!-- Textul care apare după ce se selectează No -->
  <div id="textAfterNo">
    Aaaa...m-ai gandeste-te putin!
  </div>

  <!-- Butoanele care apar după ce se selectează No -->
  <div id="yesNoButtons">
    <button id="yesAfterNo">Yes</button>
    <button id="noAfterNo" id="noButtonMove">No</button>
  </div>

  <!-- Containnerul pentru video, care va apărea doar dacă se selectează "Yes" -->
  <div id="videoContainer">
    <iframe width="420" height="315"
src="https://www.youtube.com/embed/2GeOa14pOuM?autoplay=1">
</iframe>
  </div>
</body>
</html>
